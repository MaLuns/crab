name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'Scripts/release.sh'
      - 'cliff.toml'
      - 'project.yml'
      - 'Crab/Info.plist'
      - 'FinderExtension/Info.plist'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    name: Generate commit changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate version changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && '--current --use-branch-tags --no-exec' || '--unreleased --use-branch-tags --no-exec' }}
        env:
          OUTPUT: release-notes.md
          # Retain the version even when the tagged maintenance commit is filtered out.
          GIT_CLIFF_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'unreleased' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BUILD_DIR: ${{ github.workspace }}/build/release-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build and verify ad-hoc package
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            package_tag="$GITHUB_REF_NAME"
          else
            package_tag=v0.0.0
          fi
          bash Scripts/release.sh "$package_tag" "$PACKAGE_ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Crab-${{ matrix.arch }}
          path: build/release-${{ matrix.arch }}/release/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: [build, changelog]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Crab-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: release
      - name: Verify both packages
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for arch in arm64 x86_64; do
            archive="Crab-$GITHUB_REF_NAME-macOS-$arch.zip"
            test -f "$archive"
            test -f "$archive.sha256"
            sha256sum --check "$archive.sha256"
          done
          test -s release-notes.md
      - name: Publish release and assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Crab ${{ github.ref_name }}
          body_path: release/release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release/Crab-${{ github.ref_name }}-macOS-arm64.zip
            release/Crab-${{ github.ref_name }}-macOS-arm64.zip.sha256
            release/Crab-${{ github.ref_name }}-macOS-x86_64.zip
            release/Crab-${{ github.ref_name }}-macOS-x86_64.zip.sha256
