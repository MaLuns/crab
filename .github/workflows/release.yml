name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'Scripts/release.sh'
      - 'project.yml'
      - 'Crab/Info.plist'
      - 'FinderExtension/Info.plist'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      BUILD_DIR: ${{ github.workspace }}/build/release-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build and verify ad-hoc package
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            package_tag="$GITHUB_REF_NAME"
          else
            package_tag=v0.0.0
          fi
          bash Scripts/release.sh "$package_tag" "$PACKAGE_ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Crab-${{ matrix.arch }}
          path: build/release-${{ matrix.arch }}/release/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Crab-*
          merge-multiple: true
          path: release
      - name: Verify both packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          assets=()
          for arch in arm64 x86_64; do
            archive="Crab-$GITHUB_REF_NAME-macOS-$arch.zip"
            test -f "$archive"
            test -f "$archive.sha256"
            sha256sum --check "$archive.sha256"
            assets+=("$archive" "$archive.sha256")
          done
          cat > release-notes.md <<'NOTES'
          - Apple Silicon（M 系列芯片）请选择 arm64；Intel Mac 请选择 x86_64。
          - 解压后将 Crab.app 放入应用程序目录，再打开应用并启用 Crab Finder 菜单扩展。
          - 本版本使用无需证书的 ad-hoc 签名，未进行 Apple 公证。首次打开可能需要在“系统设置 → 隐私与安全性”中允许打开。
          NOTES
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Crab $GITHUB_REF_NAME" --generate-notes --notes-file release-notes.md
