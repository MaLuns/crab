name: Crab
options:
  bundleIdPrefix: dev.crab
  deploymentTarget:
    macOS: '13.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CRAB_APP_GROUP: ''
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
targets:
  Crab:
    type: application
    platform: macOS
    sources:
      - path: Crab
        excludes: [Info.plist, Crab.entitlements]
      - path: Shared
    preBuildScripts:
      - name: Build bundled WebP codec
        script: 'bash "$SRCROOT/Support/WebP/build.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Crab/Info.plist
      properties:
        CFBundleDisplayName: Crab
        CFBundleName: Crab
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: 'Crab · Swift 原生右键工具'
        CrabAppGroupIdentifier: $(CRAB_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: dev.crab.commands
            CFBundleURLSchemes: [crab-native]
        NSAppleEventsUsageDescription: 用于读取访达中选中的文件和当前目录。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crab.Crab
        CODE_SIGN_ENTITLEMENTS: Crab/Crab.entitlements
        PRODUCT_NAME: Crab
        SWIFT_INCLUDE_PATHS: '$(SRCROOT)/Support/CArchive $(SRCROOT)/Support/WebP'
        LIBRARY_SEARCH_PATHS: '$(inherited) $(SRCROOT)/Support/WebP/lib'
        OTHER_LDFLAGS: '$(inherited) -larchive -lwebp'
    dependencies:
      - target: FinderExtension
        embed: true
      - sdk: libz.tbd
  FinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExtension
        excludes: [Info.plist, FinderExtension.entitlements]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crab.Crab.FinderExtension
        PRODUCT_NAME: CrabFinder
        INFOPLIST_FILE: FinderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderExtension/FinderExtension.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: FinderSync.framework
  CrabTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    postBuildScripts:
      - name: Bundle current script runner for isolated tests
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$SRCROOT/Crab/Services/CustomScriptRunner.swift" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ScriptRunnerSource.txt"
        basedOnDependencyAnalysis: false
    dependencies:
      - target: Crab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crab.CrabTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Crab.app/Contents/MacOS/Crab
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_INCLUDE_PATHS: '$(SRCROOT)/Support/CArchive $(SRCROOT)/Support/WebP'
        LIBRARY_SEARCH_PATHS: '$(inherited) $(SRCROOT)/Support/WebP/lib'
        OTHER_LDFLAGS: '$(inherited) -larchive -lwebp' 
schemes:
  Crab:
    build:
      targets:
        Crab: all
        CrabTests: [test]
    test:
      gatherCoverageData: true
      targets: [CrabTests]
