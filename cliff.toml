[changelog]
header = ""
body = """
{% if version %}## {{ version }} 更新内容{% else %}## 待发布更新{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/MaLuns/crab/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
{% if not commits %}暂无新增提交。{% endif %}
{% if previous and previous.version and version %}
[完整变更：{{ previous.version }} → {{ version }}](https://github.com/MaLuns/crab/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""
footer = """

## 使用说明
- Apple Silicon（M 系列芯片）请选择 arm64；Intel Mac 请选择 x86_64。
- 解压后将 Crab.app 放入应用程序目录，再打开应用并启用 Crab Finder 菜单扩展。
- 本版本使用无需证书的 ad-hoc 签名，未进行 Apple 公证。首次打开可能需要在“系统设置 → 隐私与安全性”中允许打开。
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
commit_parsers = [
  { message = '^feat(\([^)]*\))?!?:', group = "新增功能" },
  { message = '^fix(\([^)]*\))?!?:', group = "问题修复" },
  { message = '^perf(\([^)]*\))?!?:', group = "性能优化" },
  { message = '.*', group = "其他变更" },
]
tag_pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
topo_order = true
sort_commits = "oldest"
